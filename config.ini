# IMU Camera System Configuration File
# Last updated: 2026-08-02

# ============================================
# IMU Sensor Configuration
# ============================================
[imu]
# Serial device path
device = /dev/ttyUSB0

# Serial baudrate (common: 9600, 19200, 38400, 115200)
baudrate = 115200

# ============================================
# Camera Configuration (HIKvision)
# ============================================
[camera]
# Camera IP address
ip = 192.168.1.8

# Camera port (default: 8000)
port = 8000

# Authentication credentials
username = admin
password = a1234567

# Camera channel number
channel = 1

# ============================================
# Logging Configuration
# ============================================
[logging]
# Log file path (relative or absolute)
file = ./logs/imu_camera.log

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO

# ============================================
# Vision Module Configuration
# ============================================
[vision]
# Save detected license plate regions to files
save_regions = false

# Show processing steps for debugging
show_steps = false

# ============================================
# Path Configuration
# ============================================
[paths]
# Directory containing trained models (SVM.xml, OCR.xml)
models = ./models

# Directory for output files and results
output = ./output

# Directory for log files
logs = ./logs
